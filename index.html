<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mięczaki Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #c8ff00;
    --accent-hover: #b3e600;
    --accent-soft: rgba(200, 255, 0, 0.1);
    --accent-mid: rgba(200, 255, 0, 0.16);
    --accent-text: #6b8e00;
    --bg: #fafafa;
    --bg-white: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --border-light: #f3f4f6;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.03);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.03);
    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 18px;
  }

  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .container { max-width: 1060px; width: 100%; margin: 0 auto; padding: 0 24px; }

  /* ── Header ── */
  .header { text-align: center; padding: 56px 24px 16px; }
  .header-title {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(56px, 10vw, 112px);
    font-weight: 400;
    letter-spacing: 0.03em;
    line-height: 0.92;
    color: var(--text);
  }
  .header-sub {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: clamp(40px, 7vw, 76px);
    font-weight: 400;
    letter-spacing: 0.06em;
    line-height: 1;
    color: var(--text-secondary);
    display: inline-block;
    position: relative;
  }
  .header-sub::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, transparent 5%, var(--accent) 20%, var(--accent) 80%, transparent 95%);
    border-radius: 2px;
  }

  /* ── Summary Bar ── */
  .summary-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 16px 28px;
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin: 32px auto 4px;
    flex-wrap: wrap;
    box-shadow: var(--shadow-sm);
    max-width: 680px;
  }
  .summary-block { text-align: center; }
  .summary-number {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .summary-number.accent { color: var(--accent-text); }
  .summary-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 600;
  }
  .summary-divider { width: 1px; height: 26px; background: var(--border); }
  .summary-note {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-refresh-all {
    padding: 8px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text);
    background: var(--accent);
    border: none;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-refresh-all:hover { background: var(--accent-hover); box-shadow: 0 0 0 5px var(--accent-soft); }
  .btn-refresh-all:active { transform: scale(0.97); }
  .btn-refresh-all svg { width: 14px; height: 14px; }

  /* ── Flanking Row ── */
  .flanking-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    margin: 36px 0 12px;
  }
  .flanking-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .flank-card {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: 200px;
    max-width: 240px;
    transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    animation: tileReveal 0.5s ease both;
  }
  .flank-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--accent); }
  .flank-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--border-light);
    box-shadow: var(--shadow);
    transition: border-color 0.2s ease;
  }
  .flank-card:hover .flank-avatar { border-color: var(--accent); }
  .flank-avatar-fb {
    width: 72px; height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    text-transform: uppercase;
    border: 3px solid var(--border-light);
    box-shadow: var(--shadow);
  }
  .flank-role {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    color: var(--accent-text);
    background: var(--accent-soft);
    padding: 3px 12px;
    border-radius: 100px;
  }
  .flank-handle { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .flank-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
  .flank-followers { font-size: 30px; font-weight: 900; letter-spacing: -0.04em; }
  .flank-refresh {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 2px;
  }
  .flank-refresh:hover { color: var(--accent-text); border-color: var(--accent); background: var(--accent-soft); }
  .flank-refresh:active { transform: scale(0.96); }
  .flank-refresh svg { width: 12px; height: 12px; }

  /* ── Podium ── */
  .podium-section { padding: 0 0 48px; }
  .podium-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 28px;
  }
  .podium-stage {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 18px;
    max-width: 720px;
    margin: 0 auto;
    min-height: 420px;
    padding: 0 12px;
    background:
      radial-gradient(ellipse 220px 240px at 50% 82%, rgba(248,196,48,0.1) 0%, transparent 70%),
      radial-gradient(ellipse 180px 200px at 22% 82%, rgba(192,192,192,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 170px 190px at 78% 82%, rgba(200,132,71,0.07) 0%, transparent 70%);
    border-radius: var(--radius-lg);
  }
  .podium-slot {
    flex: 1;
    max-width: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    animation: podiumReveal 0.7s cubic-bezier(0.25, 0.1, 0.25, 1) both;
  }
  .podium-slot.slot-silver { animation-delay: 0.05s; }
  .podium-slot.slot-gold   { animation-delay: 0.15s; }
  .podium-slot.slot-bronze { animation-delay: 0.25s; }
  .podium-slot:hover { transform: translateY(-6px); }

  @keyframes podiumReveal {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .slot-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-bottom: 20px;
    z-index: 2;
  }
  .slot-avatar-wrap { position: relative; margin-bottom: 4px; }

  .slot-avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    box-shadow: var(--shadow-lg);
    border: 3px solid rgba(255,255,255,0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .podium-slot:hover .slot-avatar { transform: scale(1.05); box-shadow: 0 16px 48px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.04); }
  .slot-avatar.gold-border   { border-color: var(--accent); box-shadow: var(--shadow-lg), 0 0 0 4px rgba(200,255,0,0.3); }
  .slot-avatar.silver-border { border-color: #c5c9d0; }
  .slot-avatar.bronze-border { border-color: #cc9048; }

  .slot-avatar-fallback {
    width: 96px; height: 96px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 42px;
    font-weight: 800;
    color: #fff;
    box-shadow: var(--shadow-lg);
    border: 3px solid rgba(255,255,255,0.6);
    text-transform: uppercase;
  }

  .slot-rank-badge {
    position: absolute;
    bottom: -6px; right: -6px;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    box-shadow: var(--shadow);
    border: 2.5px solid #fff;
    z-index: 3;
  }
  .badge-gold   { background: linear-gradient(135deg, #f0b828, #c98a10); }
  .badge-silver { background: linear-gradient(135deg, #c5c9d0, #8e929a); }
  .badge-bronze { background: linear-gradient(135deg, #cc9048, #8b5a20); }

  .slot-handle { font-size: 12px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.01em; }
  .slot-name { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); text-align: center; }
  .slot-followers { font-size: 34px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; color: var(--text); }

  .slot-refresh {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-muted);
  }
  .slot-refresh:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
  .slot-refresh:active { transform: scale(0.9); }
  .slot-refresh svg { width: 13px; height: 13px; }

  /* Podium stands */
  .slot-stand {
    width: 100%;
    border-radius: var(--radius-sm) var(--radius-sm) 6px 6px;
    z-index: 1;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), var(--shadow-md);
  }
  .slot-stand::after {
    content: '';
    position: absolute;
    bottom: 0; left: -8%; right: -8%;
    height: 5px;
    border-radius: 0 0 4px 4px;
  }
  .stand-gold {
    height: 160px;
    background: linear-gradient(180deg, #f8d568 0%, #f0b828 30%, #d4921a 80%, #b87a10 100%);
  }
  .stand-gold::after { background: linear-gradient(180deg, #b87a10, #9a5f0a); left: -12%; right: -12%; height: 7px; }
  .stand-silver {
    height: 115px;
    background: linear-gradient(180deg, #eef0f4 0%, #d0d4da 30%, #b0b4bc 80%, #8e929a 100%);
  }
  .stand-silver::after { background: linear-gradient(180deg, #8e929a, #70747a); }
  .stand-bronze {
    height: 76px;
    background: linear-gradient(180deg, #e8c098 0%, #d4a068 30%, #c08040 80%, #a0682a 100%);
  }
  .stand-bronze::after { background: linear-gradient(180deg, #a0682a, #7a4a1a); }
  .podium-base {
    height: 6px;
    max-width: 700px;
    margin: 0 auto;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    background: linear-gradient(90deg, #9da1a8 0%, #b0b4bc 15%, #d4921a 40%, #f0b828 50%, #d4921a 60%, #b0b4bc 85%, #9da1a8 100%);
    box-shadow: var(--shadow-md);
    z-index: 0;
  }

  /* ── Tiles ── */
  .tiles-section { padding: 28px 0 60px; }
  .tiles-label {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 20px;
  }
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .tile {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    opacity: 0;
    transform: translateY(16px);
    position: relative;
  }
  .tile.visible { opacity: 1; transform: translateY(0); }
  .tile:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--accent); }

  .tile-rank {
    position: absolute;
    top: 10px; left: 12px;
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }
  .tile-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border-light);
    transition: border-color 0.2s ease;
  }
  .tile:hover .tile-avatar { border-color: var(--accent); }

  .tile-avatar-fallback {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-transform: uppercase;
    border: 2px solid var(--border-light);
    transition: border-color 0.2s ease;
  }
  .tile:hover .tile-avatar-fallback { border-color: var(--accent); }

  .tile-handle { font-size: 11px; color: var(--text-muted); font-weight: 500; }
  .tile-name { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; text-align: center; line-height: 1.2; }
  .tile-followers { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; color: var(--text); }

  .tile-refresh {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s ease;
    color: var(--text-muted);
  }
  .tile-refresh:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
  .tile-refresh:active { transform: scale(0.9); }
  .tile-refresh svg { width: 12px; height: 12px; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a2e;
    color: #fff;
    padding: 10px 26px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .tile-grid { grid-template-columns: repeat(3, 1fr); }
    .podium-stage { gap: 10px; min-height: 360px; }
    .slot-avatar { width: 78px; height: 78px; }
    .slot-avatar-fallback { width: 78px; height: 78px; font-size: 34px; }
    .slot-followers { font-size: 26px; }
    .slot-name { font-size: 13px; }
    .stand-gold { height: 130px; }
    .stand-silver { height: 94px; }
    .stand-bronze { height: 64px; }
    .flank-card { min-width: 170px; max-width: 200px; padding: 20px 18px 16px; }
    .flank-avatar, .flank-avatar-fb { width: 58px; height: 58px; font-size: 26px; }
    .flank-followers { font-size: 24px; }
  }

  @media (max-width: 650px) {
    .tile-grid { grid-template-columns: repeat(2, 1fr); }
    .podium-stage { gap: 6px; min-height: 300px; }
    .podium-slot { max-width: 150px; }
    .slot-content { gap: 4px; }
    .slot-avatar { width: 58px; height: 58px; }
    .slot-avatar-fallback { width: 58px; height: 58px; font-size: 26px; }
    .slot-rank-badge { width: 24px; height: 24px; font-size: 11px; bottom: -4px; right: -4px; }
    .slot-followers { font-size: 20px; }
    .slot-name { font-size: 11px; }
    .slot-handle { font-size: 10px; }
    .stand-gold { height: 100px; }
    .stand-silver { height: 72px; }
    .stand-bronze { height: 50px; }
    .slot-refresh { width: 24px; height: 24px; }
    .slot-refresh svg { width: 10px; height: 10px; }
    .summary-bar { gap: 12px; padding: 12px 16px; border-radius: var(--radius); }
    .summary-divider { display: none; }
    .summary-number { font-size: 20px; }
    .flanking-row { gap: 12px; }
    .flank-card { min-width: 140px; max-width: 170px; padding: 16px 12px 14px; gap: 4px; }
    .flank-avatar, .flank-avatar-fb { width: 48px; height: 48px; font-size: 22px; }
    .flank-followers { font-size: 20px; }
    .flank-name { font-size: 13px; }
    .header { padding: 36px 16px 10px; }
  }

  @media (max-width: 420px) {
    .tile-grid { grid-template-columns: 1fr; }
    .podium-stage { flex-direction: column; align-items: center; gap: 20px; min-height: auto; }
    .podium-slot { flex-direction: row; max-width: 100%; width: 100%; gap: 14px; align-items: center; }
    .slot-content { flex-direction: row; gap: 12px; padding-bottom: 0; flex: 1; flex-wrap: wrap; justify-content: flex-start; }
    .slot-stand { display: none; }
    .podium-base { display: none; }
    .container { padding: 0 14px; }
    .summary-bar { border-radius: var(--radius); }
    .flanking-row { flex-direction: column; align-items: center; gap: 12px; }
    .flank-card { max-width: 100%; width: 100%; flex-direction: row; flex-wrap: wrap; gap: 10px; justify-content: center; }
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="header">
  <div class="header-title">MIĘCZAKI</div>
  <div class="header-sub">TRACKER</div>
</header>

<main class="container">

  <!-- ── Summary Bar ── -->
  <div class="summary-bar">
    <div class="summary-block">
      <div class="summary-number accent" id="totalFollowers">0</div>
      <div class="summary-label">Łącznie obserwujących</div>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-block">
      <div class="summary-note" id="lastUpdated">ładowanie…</div>
      <div class="summary-label">Ostatnia aktualizacja</div>
    </div>
    <div class="summary-divider"></div>
    <button class="btn-refresh-all" id="btnRefreshAll" title="Odśwież wszystkie znaczniki czasu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Odśwież
    </button>
  </div>

  <!-- ── Flanking Row ── -->
  <div class="flanking-label">Projekt &amp; Coach</div>
  <div class="flanking-row" id="flankingRow"></div>

  <!-- ── Podium ── -->
  <section class="podium-section">
    <div class="podium-label">Podium — Top 3</div>
    <div class="podium-stage" id="podiumStage"></div>
    <div class="podium-base"></div>
  </section>

  <!-- ── Tiles ── -->
  <section class="tiles-section">
    <div class="tiles-label">Pozostali zawodnicy</div>
    <div class="tile-grid" id="tileGrid"></div>
  </section>

</main>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // ── Avatar URLs ──
  var AVATARS = {
    mieczaki_aj:           'https://scontent.cdninstagram.com/v/t51.82787-19/640381671_17851112268675606_6411492599442315333_n.jpg',
    ajthepolishamerican:   'https://scontent.cdninstagram.com/v/t51.2885-19/425426138_718890003554711_1654296113870723631_n.jpg',
    maquk_mieczaki:        'https://scontent.cdninstagram.com/v/t51.82787-19/722956249_18133896454508823_8306389020245049759_n.jpg',
    dori_mieczaki:         'https://scontent.cdninstagram.com/v/t51.82787-19/722313962_18125775646561236_8933908868215233617_n.jpg',
    filip_mieczaki:        'https://scontent.cdninstagram.com/v/t51.82787-19/724639980_18106869847990410_1363573698975061319_n.jpg',
    magda_mieczaki:        'https://scontent.cdninstagram.com/v/t51.82787-19/724056230_18110518426746034_3323070105018210087_n.jpg',
    oktawia_mieczaki:      'https://scontent.cdninstagram.com/v/t51.82787-19/722562746_18593495068030801_1749026841232989683_n.jpg',
    oliwia_mieczaki:       'https://scontent.cdninstagram.com/v/t51.82787-19/722447716_18331532584252689_7798981748805792061_n.jpg',
    pamelka_mieczaki:      'https://scontent.cdninstagram.com/v/t51.82787-19/722562670_18534482143077497_1395831991579907440_n.jpg',
    patrycja_mieczaki:     'https://scontent.cdninstagram.com/v/t51.82787-19/721369136_18598354663019746_621328465323547594_n.jpg',
    pati_mieczaki:         'https://scontent.cdninstagram.com/v/t51.82787-19/722956180_18122256346708934_2326955961006125668_n.jpg',
    patrykbutrym_mieczaki: 'https://scontent.cdninstagram.com/v/t51.82787-19/722753470_18046821383789642_2930992353977374138_n.jpg',
    stachu_goggins_mieczaki: 'https://scontent.cdninstagram.com/v/t51.82787-19/724019852_18129260509538278_6510507327970466076_n.jpg',
    wiktor_mieczaki:       'https://scontent.cdninstagram.com/v/t51.82787-19/723361426_18084954065175138_348038744538734164_n.jpg',
  };

  // ── Contestant definitions (with default follower counts) ──
  var CONTESTANTS = [
    { handle: 'maquk_mieczaki',        name: 'Dominik "Maquk" Makowiak',         followers: 23000, color: '#a3e635' },
    { handle: 'dori_mieczaki',         name: 'Dorota "Dori" Kaczmarek',          followers: 12000, color: '#f472b6' },
    { handle: 'filip_mieczaki',        name: 'Filip Wrzosek',                     followers: 25000, color: '#60a5fa' },
    { handle: 'magda_mieczaki',        name: 'Magdalena Majewska',                followers: 16000, color: '#f97316' },
    { handle: 'oktawia_mieczaki',      name: 'Oktawia Juszczyk',                  followers:  8086, color: '#c084fc' },
    { handle: 'oliwia_mieczaki',       name: 'Oliwia Płodzień',                   followers:  4079, color: '#34d399' },
    { handle: 'pamelka_mieczaki',      name: 'Pamela Kiedrowicz',                 followers: 33000, color: '#fbbf24' },
    { handle: 'patrycja_mieczaki',     name: 'Patrycja Bochyńska',                followers:  3684, color: '#fb7185' },
    { handle: 'pati_mieczaki',         name: 'Patrycja "Pati" Tomaszewska',       followers: 25000, color: '#818cf8' },
    { handle: 'patrykbutrym_mieczaki', name: 'Patryk Butrym',                     followers:  9635, color: '#4ade80' },
    { handle: 'stachu_goggins_mieczaki', name: 'Stanisław "Stachu" Dybowski',    followers: 19000, color: '#e879f9' },
    { handle: 'wiktor_mieczaki',       name: 'Wiktor Woroniak',                   followers: 19000, color: '#38bdf8' },
  ];

  // Flanking accounts (NOT contestants — displayed separately above podium)
  var FLANKING = [
    { handle: 'mieczaki_aj',         name: 'Mięczaki',       role: 'Projekt', followers: 129000, color: '#a3e635' },
    { handle: 'ajthepolishamerican', name: 'Adam Josef AJ',   role: 'Coach',   followers: 717000, color: '#c8ff00' },
  ];

  var STORAGE_KEY = 'mieczaki_tracker_data_v3';
  var STORAGE_TS_KEY = 'mieczaki_tracker_updated_at_v3';

  var data = {};
  var lastUpdatedAt = null;

  // DOM
  var flankingRow  = document.getElementById('flankingRow');
  var podiumStage  = document.getElementById('podiumStage');
  var tileGrid     = document.getElementById('tileGrid');
  var totalEl      = document.getElementById('totalFollowers');
  var updatedEl    = document.getElementById('lastUpdated');
  var btnRefresh   = document.getElementById('btnRefreshAll');
  var toastEl      = document.getElementById('toast');

  // ── Persistence ──
  function loadData() {
    var saved = localStorage.getItem(STORAGE_KEY);
    var savedTs = localStorage.getItem(STORAGE_TS_KEY);

    // Start with defaults
    for (var i = 0; i < CONTESTANTS.length; i++) {
      var c = CONTESTANTS[i];
      data[c.handle] = { followers: c.followers };
    }
    for (var j = 0; j < FLANKING.length; j++) {
      var f = FLANKING[j];
      data[f.handle] = { followers: f.followers };
    }

    // Overlay saved data
    if (saved) {
      try {
        var parsed = JSON.parse(saved);
        for (var k = 0; k < CONTESTANTS.length; k++) {
          var h = CONTESTANTS[k].handle;
          if (parsed[h] && typeof parsed[h].followers === 'number') data[h].followers = parsed[h].followers;
        }
        for (var m = 0; m < FLANKING.length; m++) {
          var fh = FLANKING[m].handle;
          if (parsed[fh] && typeof parsed[fh].followers === 'number') data[fh].followers = parsed[fh].followers;
        }
      } catch(e) {}
    }

    if (savedTs) {
      try { lastUpdatedAt = new Date(JSON.parse(savedTs)); } catch(e) { lastUpdatedAt = null; }
    }

    // If no timestamp yet, set it to now
    if (!lastUpdatedAt) {
      lastUpdatedAt = new Date();
      saveTimestamp();
    }
  }

  function saveTimestamp() {
    lastUpdatedAt = new Date();
    localStorage.setItem(STORAGE_TS_KEY, JSON.stringify(lastUpdatedAt.toISOString()));
  }

  // ── Formatting ──
  function fmt(n) {
    if (n === null || n === undefined) return '0';
    n = Number(n);
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return n.toLocaleString('pl-PL');
  }

  function fmtTime(date) {
    if (!date) return 'ładowanie…';
    var now = new Date();
    var diffMs = now - date;
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'przed chwilą';
    if (mins < 60) return mins + ' min temu';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' godz. temu';
    var days = Math.floor(hours / 24);
    if (days === 1) return 'wczoraj';
    if (days < 7) return days + ' dni temu';
    return date.toLocaleDateString('pl-PL', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timeout);
    toastEl._timeout = setTimeout(function() { toastEl.classList.remove('show'); }, 2200);
  }

  // ── Sorting ──
  function sortedByFollowers(list) {
    return list.slice().sort(function(a, b) {
      var diff = (data[b.handle]?.followers ?? 0) - (data[a.handle]?.followers ?? 0);
      if (diff !== 0) return diff;
      return a.name.localeCompare(b.name, 'pl');
    });
  }

  function getTopThree() {
    return sortedByFollowers(CONTESTANTS).slice(0, 3);
  }

  // ── Avatar helper ──
  function renderAvatar(handle, color, imgClass, fbClass) {
    var url = AVATARS[handle];
    var letter = (handle.charAt(0).toUpperCase());
    if (!url) {
      return '<div class="' + fbClass + '" style="background:' + color + ';">' + letter + '</div>';
    }
    return '<img class="' + imgClass + '" src="' + url + '" alt="" loading="lazy"' +
      ' onerror="var p=this.parentNode;if(p){var d=document.createElement(\'div\');d.className=\'' + fbClass + '\';d.style.background=\'' + color + '\';d.textContent=\'' + letter + '\';p.replaceChild(d,this);}">';
  }

  function followersFor(handle) {
    return data[handle]?.followers ?? 0;
  }

  // ── Render flanking row ──
  function renderFlanking() {
    flankingRow.innerHTML = FLANKING.map(function(f) {
      return '' +
        '<div class="flank-card">' +
          renderAvatar(f.handle, f.color, 'flank-avatar', 'flank-avatar-fb') +
          '<div class="flank-role">' + f.role + '</div>' +
          '<div class="flank-handle">@' + f.handle + '</div>' +
          '<div class="flank-name">' + f.name + '</div>' +
          '<div class="flank-followers">' + fmt(followersFor(f.handle)) + '</div>' +
          '<button class="flank-refresh" data-handle="' + f.handle + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>' +
            'Odśwież' +
          '</button>' +
        '</div>';
    }).join('');
  }

  // ── Render podium ──
  function renderPodium() {
    var top3 = getTopThree();
    // top3[0] = #1 (gold, center), top3[1] = #2 (silver, left), top3[2] = #3 (bronze, right)
    var silver = top3[1], gold = top3[0], bronze = top3[2];

    function slot(c, rank, slotClass, standClass, borderClass, badgeClass) {
      var h = c.handle;
      return '' +
        '<div class="podium-slot ' + slotClass + '">' +
          '<div class="slot-content">' +
            '<div class="slot-avatar-wrap">' +
              renderAvatar(h, c.color, 'slot-avatar ' + borderClass, 'slot-avatar-fallback') +
              '<div class="slot-rank-badge ' + badgeClass + '">' + rank + '</div>' +
            '</div>' +
            '<div class="slot-handle">@' + h + '</div>' +
            '<div class="slot-name">' + c.name + '</div>' +
            '<div class="slot-followers">' + fmt(followersFor(h)) + '</div>' +
            '<button class="slot-refresh" data-handle="' + h + '" title="Odśwież znacznik czasu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>' +
          '</div>' +
          '<div class="slot-stand ' + standClass + '"></div>' +
        '</div>';
    }

    podiumStage.innerHTML =
      slot(silver, 2, 'slot-silver', 'stand-silver', 'silver-border', 'badge-silver') +
      slot(gold,   1, 'slot-gold',   'stand-gold',   'gold-border',   'badge-gold') +
      slot(bronze, 3, 'slot-bronze', 'stand-bronze', 'bronze-border', 'badge-bronze');
  }

  // ── Render tiles ──
  function renderTiles() {
    var sorted = sortedByFollowers(CONTESTANTS);
    var top3Handles = getTopThree().map(function(c) { return c.handle; });

    var remaining = sorted.filter(function(c) { return top3Handles.indexOf(c.handle) === -1; });

    tileGrid.innerHTML = remaining.map(function(c, i) {
      var rank = i + 4;
      var h = c.handle;
      return '' +
        '<div class="tile" data-handle="' + h + '" style="transition-delay:' + (i * 0.04) + 's">' +
          '<div class="tile-rank">#' + rank + '</div>' +
          renderAvatar(h, c.color, 'tile-avatar', 'tile-avatar-fallback') +
          '<div class="tile-handle">@' + h + '</div>' +
          '<div class="tile-name">' + c.name + '</div>' +
          '<div class="tile-followers">' + fmt(followersFor(h)) + '</div>' +
          '<button class="tile-refresh" data-handle="' + h + '" title="Odśwież znacznik czasu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>' +
        '</div>';
    }).join('');

    // Stagger animations
    requestAnimationFrame(function() {
      var tiles = tileGrid.querySelectorAll('.tile');
      for (var t = 0; t < tiles.length; t++) {
        (function(el, delay) {
          setTimeout(function() { el.classList.add('visible'); }, delay);
        })(tiles[t], t * 45);
      }
    });
  }

  // ── Summary ──
  function updateSummary() {
    var total = 0;
    for (var i = 0; i < CONTESTANTS.length; i++) {
      total += followersFor(CONTESTANTS[i].handle);
    }
    for (var j = 0; j < FLANKING.length; j++) {
      total += followersFor(FLANKING[j].handle);
    }
    totalEl.textContent = fmt(total);
    updatedEl.textContent = fmtTime(lastUpdatedAt);
  }

  function renderAll() {
    renderFlanking();
    renderPodium();
    renderTiles();
    updateSummary();
  }

  // ── Refresh (timestamp only, no data manipulation) ──
  function refreshTimestamp(handle) {
    saveTimestamp();
    renderAll();
    showToast('Znacznik czasu odświeżony');
  }

  function refreshAllTimestamp() {
    saveTimestamp();
    renderAll();
    showToast('Wszystkie znaczniki czasu odświeżone');
  }

  // ── Event delegation: refresh buttons ──
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.slot-refresh, .tile-refresh, .flank-refresh');
    if (!btn) return;
    var handle = btn.dataset.handle;
    refreshTimestamp(handle);
  });

  btnRefresh.addEventListener('click', function() {
    refreshAllTimestamp();
  });

  // Keyboard shortcut
  document.addEventListener('keydown', function(e) {
    if (e.key === 'r' && e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      refreshAllTimestamp();
    }
  });

  // ── Init ──
  loadData();
  renderAll();

  console.log('%c🥩 Mięczaki Tracker v3 %cready',
    'color:#6b8e00;font-weight:bold;font-size:15px;', 'color:#aaa;');
  console.log('%cRefresh buttons update the timestamp only — no fake data.',
    'color:#6b8e00;', 'color:#aaa;');
})();
</script>

</body>
</html>
