name: Daily Data Refresh

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'daily-scrape'
  cancel-in-progress: true

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: python3 -m pip install instaloader beautifulsoup4

      - name: Install Node dependencies
        run: npm ci

      - name: Run Instagram Scraper
        run: python3 scripts/scraper.py

      - name: Run checks and tests
        run: |
          npm run check
          npm run typecheck
          npm run test
          python3 -m unittest discover tests

      - name: Commit and push data updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/avatars/
          if ! git diff --staged --quiet; then
            git commit -m "auto: daily Instagram data refresh"
            git push origin HEAD:main
          fi

      - name: Build Vite application
        run: npm run build

      - name: Deploy to gh-pages branch
        run: |
          tmp_dist=$(mktemp -d)
          cp -r dist/* "$tmp_dist/"
          git checkout --orphan gh-pages-temp
          git reset --hard
          git clean -fdx
          cp -r "$tmp_dist"/* .
          touch .nojekyll
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "deploy: update GitHub Pages build assets"
            git push -f origin gh-pages-temp:gh-pages
          fi
