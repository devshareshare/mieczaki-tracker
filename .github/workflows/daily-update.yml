name: Daily Data Refresh

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'daily-scrape'
  cancel-in-progress: true

jobs:
  scrape-build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python dependencies
        run: python3 -m pip install instaloader beautifulsoup4

      - name: Install Node dependencies
        run: npm ci

      - name: Run Instagram Scraper
        run: python3 scripts/scraper.py

      - name: Run checks and tests
        run: |
          npm run check
          npm run typecheck
          npm run test
          python3 -m unittest discover tests

      - name: Commit and push data updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/avatars/
          if ! git diff --staged --quiet; then
            git commit -m "auto: daily Instagram data refresh"
            git push origin HEAD:main
          fi

      - name: Build Vite application
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
